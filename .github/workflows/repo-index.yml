name: Repo index
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ['docs/REPO_INDEX.md']
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate index
        run: |
          BASE="https://github.com/${{ github.repository }}/blob/master"
          {
            echo "# Repo index (generated $(date -u +%F))"
            echo
            git ls-files \
              | grep -vE '^(uv\.lock|reference/|\.agents/)' \
              | grep -vE '\.(png|jpg|parquet|duckdb|db|zip)$' \
              | grep -v '^docs/REPO_INDEX.md$' \
              | while read -r f; do echo "- [$f]($BASE/$f)"; done
          } > docs/REPO_INDEX.md
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/REPO_INDEX.md
          git diff --cached --quiet || (git commit -m "Update repo index" && git push)
